version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kayas_watch_db
    environment:
      POSTGRES_USER: kayas
      POSTGRES_PASSWORD: kayas_password
      POSTGRES_DB: kayas_watch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: kayas_watch_kuma
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
  uptime-kuma-data:
