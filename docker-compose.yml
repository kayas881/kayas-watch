version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kayas_watch_db
    environment:
      POSTGRES_USER: kayas
      POSTGRES_PASSWORD: kayas_password
      POSTGRES_DB: kayas_watch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kayas_watch_web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://kayas:kayas_password@db:5432/kayas_watch?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=my-super-secret-key-change-me-in-production
      - CRON_SECRET=dev-cron-secret-123
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
